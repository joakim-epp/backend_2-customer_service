name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
   contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: customer-service

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  image:
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Set image version
        id: version
        run: echo "version=build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: local/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published version
        if: github.event_name == 'push'
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: echo "Published ${IMAGE_NAME}:${IMAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.49.0

      - name: Start Railway deployment
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.image.outputs.version }}
          RAILWAY_SERVICE_ID: 01d033ee-8c01-4c9b-9bd9-65c5ee45afe2
          RAILWAY_ENVIRONMENT_ID: 685d7dbd-8e4b-4dbf-ac2b-42496851452e
        run: |
          selectors=(--compact --raw-var "serviceId=$RAILWAY_SERVICE_ID"
                     --raw-var "environmentId=$RAILWAY_ENVIRONMENT_ID")

          # GraphQL variables must reach Railway without shell expansion.
          # shellcheck disable=SC2016
          railway api '
            mutation($serviceId: String!, $environmentId: String!, $image: String!) {
              serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId,
                                    input: {source: {image: $image}})
            }' "${selectors[@]}" --raw-var "image=$RAILWAY_IMAGE" |
            jq -e '.data.serviceInstanceUpdate == true' > /dev/null

          # shellcheck disable=SC2016
          deployment_id=$(railway api '
            mutation($serviceId: String!, $environmentId: String!) {
              serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId)
            }' "${selectors[@]}" |
            jq -er '.data.serviceInstanceDeployV2 | select(type == "string" and length > 0)')
          echo "Railway accepted deployment $deployment_id for $RAILWAY_IMAGE" >> "$GITHUB_STEP_SUMMARY"
