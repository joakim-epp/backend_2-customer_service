spring.application.name=customer-service
server.port=${PORT:8080}
# Railway terminates TLS and forwards X-Forwarded-*, without this Location headers say http://.
server.forward-headers-strategy=native

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat
app.jwt.expiry-minutes=60

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8081}

# Two specs in one Swagger UI: this service, and the contract the booking service is expected to
# honour. The second one is served straight out of static/ and is currently answered by a stub.
springdoc.swagger-ui.urls[0].name=Kundtjansten
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Bokningstjansten (attrapp)
springdoc.swagger-ui.urls[1].url=/openapi/booking-service.yaml
springdoc.swagger-ui.urls-primary-name=Kundtjansten

# Only /actuator/health is exposed by default. The liveness group answers whether the process is
# up, readiness also checks the database, so a lost connection takes the pod out of the Service
# instead of restarting it.
management.endpoint.health.probes.enabled=true
