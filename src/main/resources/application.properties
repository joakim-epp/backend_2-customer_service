spring.application.name=customer-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat
app.jwt.expiry-minutes=60

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8081}
