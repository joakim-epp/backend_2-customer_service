services:
  customer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  customer-service:
    build: .
    # Tagged so that k8s/ and compose share one build. Without it compose names the image after
    # the project directory and the Deployment's image: customer-service:latest never resolves.
    image: customer-service:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-db:5432/customerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOOKING_SERVICE_URL: http://booking-service:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      customer-db:
        condition: service_healthy

  # Stand-in for the booking service until the real one is ready. WireMock answers the one
  # endpoint the customer service needs: customer 1 has two active bookings, everyone else has
  # none. Delete this block and its stubs/ directory once the real service is in the compose file.
  booking-service:
    image: wiremock/wiremock:3.9.1
    # CORS so that "Try it out" in the customer service's Swagger UI can reach it.
    command: ["--port", "8081", "--verbose", "--enable-stub-cors"]
    ports:
      - "8081:8081"
    volumes:
      - ./stubs/booking-service/mappings:/home/wiremock/mappings:ro

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build: ../backend2_notification-service
    image: notification-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      CUSTOMER_SERVICE_URL: http://customer-service:8080
    depends_on:
      notification-db:
        condition: service_healthy

volumes:
  customer-db-data:
  notification-db-data:
